version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: trading_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=2 --max-tasks-per-child=100
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=${***      - ALGORITHM=HS256
      - OPENROUTER_API_BASE=${OPENROUTER_API_BASE}
      - OPENROUTER_API_KEY=${OPEN...-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemma-4-31b-it}
      - TELEGRAM_BOT_TOKEN=${TELE...-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - ./backend:/app
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=warning
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=${***    volumes:
      - ./backend:/app
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=${***      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=***      - OPENROUTER_API_BASE=${OPENROUTER_API_BASE}
      - OPENROUTER_API_KEY=${OPEN...-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemma-4-31b-it}
      - TELEGRAM_BOT_TOKEN=${TELE...-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DEFAULT_TIMEFRAME=${DEFAULT_TIMEFRAME:-1h}
      - DEFAULT_INITIAL_CAPITAL=${DEFAULT_INITIAL_CAPITAL:-10000}
      - MAX_POSITION_PCT=${MAX_POSITION_PCT:-2.0}
      - MAX_DRAWDOWN_PCT=${MAX_DRAWDOWN_PCT:-10.0}
      - DAILY_LOSS_LIMIT_PCT=${DAILY_LOSS_LIMIT_PCT:-5.0}
    volumes:
      - ./backend:/app
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    restart: always
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./dashboard:/app
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - dashboard

volumes:
  postgres_data:
  redis_data:

